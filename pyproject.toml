[project]
name = "low-resource-asr"
version = "0.1.0"
description = "ASR for Endangered Languages - Term Project"
readme = "README.md"
# kenlm (pyctcdecode dep) does not build on Python 3.13+ due to CPython API changes
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # Core ML
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "datasets[audio]>=2.16.0", # [audio] pulls in torchcodec for decoding (needs Python 3.11–3.13 on some platforms)
    "accelerate>=0.25.0",
    # Audio processing
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    # Evaluation
    "jiwer>=3.0.0",
    "evaluate>=0.4.0",
    # Model serialization
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    # Data handling
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # Utilities
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyctcdecode>=0.5.0",
    "kenlm>=0.3.0",
    "cartopy>=0.25.0",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.1.0",
    "ipykernel>=6.27.0",
    "jupyter>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.1.0",
    "ipykernel>=6.27.0",
    "jupyter>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
